<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Empereur, Citoyen, Esclave </title>
    <link href="./css/output.css" rel="stylesheet">
</head>

<body class="bg-cover bg-center bg-no-repeat min-h-screen bg-fixed"
    style="background-image: url('./images/bagh\ jeu.png')">
    <!-- ===================== EN-TÊTE ===================== -->
    <header>
        <div class="flex w-full items-center justify-between px-1 py-1 sm:px-1 lg:px-4 bg-[#191818]">

            <div class="flex items-center gap-3">
                <img class="h-15 w-20" src="./images/King.png" alt="logo">
                <span class="rounded-full text-white  px-7 py-8 font-extrabold text-900 hover "><span
                        style=" color:#181819;">👑</span> ​Empereur • Citoyen • Esclave</span> jouer.html
            </div>
            <nav aria-label="Navigation principale" class="flex flex-wrap gap-2">
                <a href="./Accueil.html"
                    class="rounded-full bg-white px-4 py-2 font-bold text-slate-900 hover:shadow-lg hover:shadow-amber-400 transition-colors hover:-translate-y-3">ACCUEIL</a>
                <a href="./profil.html"
                    class="rounded-full bg-white px-4 py-2 font-bold text-slate-900 hover:shadow-lg hover:shadow-amber-400 transition-colors hover:-translate-y-3">Profil</a>
                <a href="./jouer.html"
                    class="rounded-full bg-white px-4 py-2 font-bold text-slate-900 hover:shadow-lg hover:shadow-amber-400 transition-colors hover:-translate-y-3">Jouer</a>
                <a href="./historique.html"
                    class="rounded-full bg-white px-4 py-2 font-bold text-slate-900 hover:shadow-lg hover:shadow-amber-400 transition-colors hover:-translate-y-3">Historique</a>
            </nav>
        </div>
    </header>
    <main class="max-w-7xl mx-auto px-8 py-8">
        <!------------------- jouer page--------------------->
        <section id="joue" class="w-full min-h-screen p-1/4  ">
            <div class="flex gap-4 mb-10 flex-wrap ">
                <div
                    class="flex-items-center justify-between gap-3 px-4 py-2 bg-gradient-to-br from-[#30271e]to-[#17120f] border border-[#94764b] rounded-lg">
                    <span class="text-[#d6a653]text-xl">⚔️</span>
                    <span class="text-[#e5d6b5] text-base font-serif">Manche 1/12</span>
                </div>

                <div
                    class="flex-items-center justify-between gap-3 px-4 py-2 bg-gradient-to-br from-[#30271e]to-[#17120f] border border-[#94764b] rounded-lg">
                    <span class="text-[#d6a653] text-xl">👥</span>
                    <span class="text-[#e5d6b5] text-base font-serif"> Score[0-0]</span>
                </div>
                <div
                    class="flex-items-center justify-between gap-3 px-4 py-2 bg-gradient-to-br from-[#30271e]to-[#17120f] border border-[#94764b] rounded-lg">
                    <span id="groupe" class="text-[#e5d6b5] text-base font-serif">Groupe 1/4</span>
                </div>
                <div
                    class="flex-items-center justify-between gap-3 px-4 py-2 bg-gradient-to-br from-[#30271e]to-[#17120f] border border-[#94764b] rounded-lg">
                    <span id="camp-joueur" class="text-[#e5d6b5] text-base font-serif">Camp: Empereur</span>
                </div>
                <div
                    class="flex-items-center justify-between gap-3 px-4 py-2 bg-gradient-to-br from-[#30271e]to-[#17120f] border border-[#94764b] rounded-lg">
                    <span id="premier-joueur" class="text-[#e5d6b5] text-base font-serif">premier à jouer: Joueur</span>
                </div>


            </div>


            <!----------------------carte------------------------->
            <div class="flex flex-col items-center gap-8 p-5">
                <h2 class="text-2xl font-bold text-[#C5A05A] "> Duel Actuel
                </h2>

                <div class=" flex items-center justify-center gap-6 w-full flex-nowrap ">
                    <div class="w-40 shrink-0 flex flex-col items-center">
                        <h2 class="text-white text-xl font-bold mb-3"></h2>
                        <img src="./images/emperor.png" class="w-full h-auto object-contain rounded-xl">
                    </div>
                    <span class="text-5xl text-[#C5A05A]">VS</span>
                    <div class="w-40 flex flex-col items-center">
                        <h2 class="text-white text-xl font-bold mb-3"></h2>
                        <img src="./images/esclave3.png" class="w-full h-auto object-contain rounded-xl">
                    </div>
                </div>
            </div>
            <!-------------------------Main ordinateur-------------------------->
            <div class="grid grid-cols-2 gap-8 mt-10 px-4">

                <!--------------------carte ordinateur à gauche------------------->
                <section id="cartes-ordinateur" class="flex flex-row flex-wrap justify-center gap-4">
                    <h2 class="text-center text-2xl font-bold text-[#C5A05A]">Cartes de ordinateur</h2>
                    <div class="grid grid-cols-5 gap-6">
                        <div class="w-30 shrink-0 flex flex-col rounded-2xl">
                            <img src="./images/emperor.png" class="w-40 h-auto object-contain">
                        </div>
                        <div class="w-30 shrink-0 flex flex-col rounded-2xl">
                            <img src="./images/carte vide.png" class="w-40 h-auto object-contain">
                        </div>
                        <div class="w-30 shrink-0 flex flex-col rounded-2xl">
                            <img src="./images/carte vide.png" class="w-40 h-auto object-contain">
                        </div>
                        <div class="w-30 shrink-0 flex flex-col rounded-2xl">
                            <img src="./images/carte vide.png" class="w-40 h-auto object-contain">
                        </div>
                        <div class="w-30 shrink-0 flex flex-col rounded-2xl">
                            <img src="./images/carte vide.png" class="w-40 h-auto object-contain">
                        </div>
                </section>


                <!-------------------- carte joueur à droite ------------------->
                <section id="cartes-joueur" class="flex flex-row flex-wrap justify-center gap-4">
                    <h2 class="text-center text-2xl font-bold text-[#C5A05A]">vos cartes</h2>

                    <div class="grid grid-cols-5 gap-6">
                        <div class="w-30 shrink-0 flex flex-col rounded-2xl">
                            <img src="./images/esclave3.png" class="w-40 h-auto object-contain">
                        </div>
                        <div class="w-30 shrink-0 flex flex-col rounded-2xl">
                            <img src="./images/citoyen.png" class="w-40 h-auto object-contain">
                        </div>
                        <div class="w-30 shrink-0 flex flex-col rounded-2xl">
                            <img src="./images/citoyen.png" class="w-40 h-auto object-contain">
                        </div>
                        <div class="w-30 shrink-0 flex flex-col rounded-2xl">
                            <img src="./images/citoyen.png" class="w-40 h-auto object-contain">
                        </div>
                        <div class="w-30 shrink-0 flex flex-col rounded-2xl">
                            <img src="./images/citoyen.png" class="w-40 h-auto object-contain">
                        </div>
                </section>
            </div>
            <!----------------Resultat du duel-------------->
            <section class="text-center mt-8">
                <p id="resultat-duel" class="text-2xl font-bold text-[#C5A05A]">EN attente du duel...

            </section>

            <!----------Fin de partie- et Rejouer---------->

            <section id="fin de partie"
                class="hidden flex-col text-center gap-4 mt-10 mx-auto bg-[#191818] border border-[#94764b] text-white p-6 rounded-xl w-72">
                <h2 class="text-2xl font-bold text-amber-400">Fin de partie !</h2>
                <p id="resultat-final" class="text-center">Resultat de la partie</p>
                <button id="Rejouer"
                    class="text-white bg-amber-500 hover:bg-amber-600 px-6 py-2 rounded-lg font-bold">Rejouer ↺</button>
            </section>
            
        <script type="module" src="./src/game.js"></script>
        
            
</body>

</html>
