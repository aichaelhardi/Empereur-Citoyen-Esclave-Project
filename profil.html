<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Empereur, Citoyen, Esclave </title>
    <link href="./css/output.css" rel="stylesheet">
</head>

<body class="bg-cover bg-center bg-no-repeat min-h-screen bg-fixed bg-[#F5F5DC]">
    <!-- ===================== EN-TÊTE ===================== -->
    <header>
        <div class="flex w-full items-center justify-between px-1 py-1 sm:px-1 lg:px-4 bg-[#191818]">

            <div class="flex items-center gap-3">
                <img class="h-15 w-20" src="./images/King.png" alt="logo">
                <span class="rounded-full text-white  px-7 py-8 font-extrabold text-900 hover "><span
                        style=" color:#181819;">👑</span> ​Empereur • Citoyen • Esclave</span>

            </div>
            <nav aria-label="Navigation principale" class="flex flex-wrap gap-2">
                <a href="#accueil"
                    class="rounded-full bg-white px-4 py-2 font-bold text-slate-900 hover:bg-amber-400 transition-colors">ACCUEIL</a>
                <a href="#jouer"
                    class="rounded-full bg-white px-4 py-2 font-bold text-slate-900 hover:bg-amber-400 transition-colors">Jouer</a>
                <a href="#profil"
                    class="rounded-full bg-white px-4 py-2 font-bold text-slate-900 hover:bg-amber-400 transition-colors">Profil</a>
                <a href="#historique"
                    class="rounded-full bg-white px-4 py-2 font-bold text-slate-900 hover:bg-amber-400 transition-colors">Historique</a>
            </nav>
        </div>
    </header>
    <main class="max-w-7xl px-8 py-8">
        <!-- ===================== Profil Page ===================== -->
        <section id="profil" class="flex flex-wrap w-18/16 justify-between gap-6 p-6  ">
            <div class="flex items-center justify-between w-full">
                <h1 class="text-4xl font-bold ">👥Mes profils</h1>
                <button><span
                        class="chip px-6 py-3 rounded-xl bg-cover bg-red-700 bg-center text-white font-bold text-sm text-slate-900 hover:bg-amber-400 transition-colors">+
                        Ajouter un profil</span>
                </button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4  gap-5 ">
                <!------------ Cards 1-------------->

                <div class="bg-white border border-red-700 rounded-xl p-7 text-center shadow-sm gap-6">
                    <img src="./images/avatar1.png" class="w-20 h-20 rounded-full mx-auto mb-3">
                    <p class="font-bold text-lg">Regina</p>
                    <p class="text-gray-500 text-sm mb-4"> 12 parties</p>
                    <div class="flex-justify-center gap-8 p-3">
                        <button class="text-gray-800">​🖋️</button>
                        <button class="text-red-500 hover:bg-amber-400 transition-colors text-red-500">❌</button>
                    </div>
                </div>

                <div class="bg-white border border-red-700 rounded-xl p-7 text-center shadow-sm">
                    <img src="./images/avatar2.png" class="w-20 h-20 rounded-full mx-auto mb-3">
                    <p class="font-bold text-lg">ApexLegend</p>
                    <p class="text-gray-500 text-sm mb-4"> 8 parties</p>
                    <div class="flex-justify-center gap-8 p-3">
                        <button class="text-gray-800 ">​🖋️</button>
                        <button class="text-sm">❌</button>
                    </div>
                </div>
                <div class="bg-white border border-red-700 rounded-xl p-7 text-center shadow-sm">
                    <img src="./images/avatar3.png" class="w-20 h-20 rounded-full mx-auto mb-3">
                    <p class="font-bold text-lg">Azura</p>
                    <p class="text-gray-500 text-sm mb-4"> 5 parties</p>
                    <div class="flex-justify-center gap-8 p-3">
                        <button class="text-gray-800">​🖋️</button>
                        <button class="text-red-500 hover:bg-amber-400 transition-colors">❌</button>
                    </div>
                </div>
                <div class="bg-white border border-red-700 rounded-xl p-7 text-center shadow-sm">
                    <img src="./images/avatar5.png" class="w-20 h-20 rounded-full mx-auto mb-3">
                    <p class="font-bold text-lg">Astrid</p>
                    <p class="text-gray-500 text-sm mb-4"> 3 parties</p>
                    <div class="flex-justify-center gap-8 p-3">
                        <button class="text-[#181819]">​🖋️</button>
                        <button class="text-red-500 hover:bg-amber-400 transition-colors">❌</button>
                    </div>
                </div>
                <div class="flex flex-col gap-6 rounded-card bg-[#E5CB90] p-8">
                    <h2 class="font-display text-3xl font-bold text-red-500">Modifier un profil</h2>
                    <p class="text-sm">pseudo </p>
                    <label class="flex w-full max-w-md flex-col gap-2 text-sm font-bold">

                        <input placeholder="Astrid..." class="field font-normal border rounded-lg p-4">
                    </label>
                    <p class="text-sm"> Avatar</p>
                    <input placeholder="" class="field font-normal border rounded-lg p-4">
                    <button><span
                        class="chip px-6 py-3 rounded-xl bg-cover bg-red-700 bg-center text-white font-bold text-sm text-slate-900 hover:bg-amber-400 transition-colors">
                      Enregistrer les modifications </span>
                </button>
                    
                </div>
