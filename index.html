<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empereur, Citoyen, Esclave Game</title>
  <link href="./css/output.css" rel="stylesheet">
</head>

<body class="bg-cover bg-center bg-no-repeat min-h-screen bg-fixed"
  style="background-image: url('./images/photo\ bagh.png');">
  <!-- ===================== EN-TÊTE ===================== -->
  <header>
    <div class="flex w-full items-center justify-between gap-3 px-3 py-3 sm:px-5 lg:px-8 bg-beige-500">
      <div class="flex items-center gap-3">
        <img class="h-15 w-20" src="./images/King.png" alt="logo">
        <span class="rounded-full text-white  px-7 py-8 font-extrabold text-900 hover">Empereur</span>
        <span class="rounded-full text-white  px-7 py-8 font-extrabold text-900 hover">Citoyen</span>
        <span class="rounded-full text-white  px-7 py-8 font-extrabold text-900 hover">Esclave</span>
      </div>
      <nav aria-label="Navigation principale" class="flex flex-wrap gap-2">
        <a href="#accueil"
          class="rounded-full bg-white px-4 py-2 font-bold text-slate-900 hover:bg-amber-400 transition-colors">ACCUEIL</a>
        <a href="#jouer"
          class="rounded-full bg-white px-4 py-2 font-bold text-slate-900 hover:bg-amber-400 transition-colors">Jouer</a>
        <a href="#profil"
          class="rounded-full bg-white px-4 py-2 font-bold text-slate-900 hover:bg-amber-400 transition-colors">Profil</a>
        <a href="#historique"
          class="rounded-full bg-white px-4 py-2 font-bold text-slate-900 hover:bg-amber-400 transition-colors">Historique</a>
      </nav>
    </div>
  </header>
  <main class="max-w-7xl px-8 py-8">
    <!--=======================   ACCEUIL PAGE  =========================-->
    <section id="Acceuil" class="flex flex-col items-center w-1/4 justify-center gap-6 p-6  rounded-card shadow-sm ">
      <h1 class="texte-sm text-white ">une Jeu de stratégie et de réflexion</h1>
      <div class="flex flex-col items-center justify-center gap-4">

        <p class=" text-3xl font-bold text-white ">Empereur,</p>

        <p class="text-3xl font-bold text-white texte-sm">Citoyen,</p>

        <p class="text-4xl font-extrabold text-red-500 texte-sm">Esclave</p>
        <p class="text-sm font-bold text-white texte-sm">choisis ton profil affronte l'ordinateur et gimpe dans classement.Qui sera le plus fort? </p>
        <div class="flex flex-wrap gap-3 p-4">
        <button><span class="chip px-6 py-3 rounded-xl bg-cover bg-red-500 bg-center text-white font-bold text-sm shadow-md">Jouer maintenant</span></button>
        <button><span class="chip px-6 py-3 rounded-xl bg-cover bg-gray-500 bg-center text-white font-bold text-sm shadow-md">En savoir plus</span></button>
      </div>
    </section>














  </main>
</body>

</html>
